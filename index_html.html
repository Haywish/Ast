<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asteria: Echoes of the Celestial</title>
<style>
:root{color-scheme:dark;--glass:rgba(13,22,39,.76);--line:rgba(225,218,255,.25)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2c;font-family:Georgia,serif;color:#f6f0ff}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:10px 14px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0003}
.brand{font-size:19px;letter-spacing:3px}.sub{font:11px system-ui;opacity:.75;margin-top:4px}
#counter{font:14px system-ui}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}
#quest{max-width:330px;font:13px/1.45 system-ui}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;max-width:85vw;opacity:0;transition:opacity .25s;font:14px system-ui}
#toast.show{opacity:1}
.controls{pointer-events:auto;display:flex;align-items:end;gap:18px}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:5px}
button{border:1px solid #d8cbff66;background:#1c2946dd;color:white;border-radius:12px;font-size:18px;touch-action:none;min-width:44px;min-height:42px}
button:active{background:#7966b9}
.pad button{font-size:19px}
.actions{display:flex;flex-direction:column;gap:7px}
.actions button{font:12px system-ui;padding:10px 12px}
#spell{background:#65509b}
#help{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);font:11px system-ui;color:#fff9;text-align:center;pointer-events:none;white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#40516d,#11182b 70%);z-index:5;text-align:center;padding:24px}
#loading h1{letter-spacing:5px;font-size:clamp(24px,6vw,42px);font-weight:normal}
#loading p{font:14px/1.6 system-ui;color:#e2dcf3}
#loading .small{font-size:12px;opacity:.7}
#loading button{padding:12px 20px;margin-top:12px;font:14px system-ui}
.hidden{display:none!important}
@media(max-width:600px){#hud{padding:10px}.brand{font-size:15px}.panel{padding:8px 10px}.bottom{align-items:end}.controls{gap:8px}.pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,40px)}#quest{max-width:170px;font-size:11px}.actions button{padding:9px 8px}#help{bottom:4px;font-size:9px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">
 <div>
  <div style="font-size:34px">✧</div>
  <h1>ASTERIA</h1>
  <p>Echoes of the Celestial</p>
  <p id="loadmsg">Waking the starlight engine…</p>
  <p class="small">A little 3D fantasy adventure</p>
  <button id="retry" class="hidden">Try loading again</button>
 </div>
</div>
<div id="hud" class="hidden">
 <div class="top">
  <div class="panel"><div class="brand">ASTERIA</div><div class="sub">STARLIGHT VALLEY · CHAPTER I</div></div>
  <div class="panel" id="counter">✧ 0 / 5</div>
 </div>
 <div id="toast"></div>
 <div class="bottom">
  <div class="panel" id="quest">Quest: Find the five lost star fragments hidden around the valley.</div>
  <div class="controls">
   <div class="pad">
    <span></span><button data-key="up">↑</button><span></span>
    <button data-key="left">←</button><button data-key="down">↓</button><button data-key="right">→</button>
   </div>
   <div class="actions">
    <button id="spell">✧ STARBURST</button>
    <button id="jump">JUMP</button>
   </div>
  </div>
 </div>
</div>
<div id="help" class="hidden">WASD / arrows to move · Space to jump · E to cast · Drag to rotate camera</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
 const loading=document.getElementById('loading'),loadmsg=document.getElementById('loadmsg'),retry=document.getElementById('retry');
 const start=()=>{
  if(!window.THREE){loadmsg.textContent='The 3D library could not load. Check your internet connection, then try again.';retry.classList.remove('hidden');return;}
  retry.classList.add('hidden');loadmsg.textContent='Almost there…';
  try{init();}catch(e){console.error(e);loadmsg.textContent='The game could not start in this browser. Try opening this file in Safari or Chrome.';retry.classList.remove('hidden');}
 };
 retry.addEventListener('click',()=>{loadmsg.textContent='Trying again…';if(window.THREE)start();else location.reload();});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();

 function init(){
  const THREE=window.THREE, host=document.getElementById('game');
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbfd5);scene.fog=new THREE.Fog(0x9bbfd5,45,125);
  const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
  host.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xddeeff,0x42513e,2.1));
  const sun=new THREE.DirectionalLight(0xffe8c5,2.7);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
  const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x527b5c));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  // Rolling hills around the edge of the valley
  for(let i=0;i<24;i++){const a=i*Math.PI*2/24,r=65+(i%3)*5;const h=new THREE.Mesh(new THREE.ConeGeometry(13+(i%4)*2,23+(i%5)*3,6),mat(i%2?0x708c83:0x617d75));h.position.set(Math.cos(a)*r,10,Math.sin(a)*r);h.rotation.y=a;h.castShadow=true;scene.add(h);
   const cap=new THREE.Mesh(new THREE.ConeGeometry(5,7,6),mat(0xd8e2df));cap.position.set(h.position.x,19+(i%5)*3,h.position.z);scene.add(cap);}
  // A reflective little lake
  const lake=new THREE.Mesh(new THREE.CircleGeometry(10,48),new THREE.MeshStandardMaterial({color:0x4d9ba9,roughness:.22,metalness:.1}));lake.rotation.x=-Math.PI/2;lake.position.set(19,.04,-18);scene.add(lake);
  // Trees
  const foliage=mat(0x315b45),bark=mat(0x74533e);
  for(let i=0;i<90;i++){const a=i*2.399,r=13+(i%12)*2.5,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z)<9)continue;
   const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.4,2.4,7),bark);trunk.position.set(x,1.2,z);trunk.castShadow=true;scene.add(trunk);
   for(let j=0;j<3;j++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(1.55-j*.22,3.1,7),foliage);leaf.position.set(x,2.4+j*1.25,z);leaf.castShadow=true;scene.add(leaf);}}
  // Ancient stone arch and broken columns
  const stone=mat(0xb4b7a8);
  for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,5,8),stone);p.position.set(-21+i*2.5,2.5,-8);p.castShadow=true;scene.add(p);}
  const lintel=new THREE.Mesh(new THREE.BoxGeometry(14,.9,1.2),stone);lintel.position.set(-16,5.1,-8);scene.add(lintel);
  // Glowing flowers
  for(let i=0;i<130;i++){const a=i*2.4,r=4+(i%20)*1.2;const f=new THREE.Mesh(new THREE.SphereGeometry(.105,7,6),mat(i%2?0xe9b9e2:0xd9d0ff));f.position.set(Math.cos(a)*r,.15,Math.sin(a)*r);scene.add(f);}
  // Player, intentionally simple stylized adventurer
  const hero=new THREE.Group();scene.add(hero);
  const skin=mat(0xf0cfb8),hair=mat(0x493e6d),blue=mat(0x627eae),ivory=mat(0xe2def0);
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.9,4,8),blue);torso.position.y=1.35;torso.castShadow=true;hero.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.39,16,12),skin);head.position.y=2.35;head.castShadow=true;hero.add(head);
  const hairTop=new THREE.Mesh(new THREE.SphereGeometry(.42,12,9),hair);hairTop.scale.set(1,.58,1);hairTop.position.set(0,2.63,-.04);hero.add(hairTop);
  const hairBack=new THREE.Mesh(new THREE.ConeGeometry(.23,1,8),hair);hairBack.position.set(0,1.9,-.38);hairBack.rotation.x=-.35;hero.add(hairBack);
  const cape=new THREE.Mesh(new THREE.ConeGeometry(.65,1.4,8),ivory);cape.position.set(0,1.05,-.42);cape.rotation.x=-.25;hero.add(cape);
  const charm=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:0xc8aaff}));charm.position.set(.52,1.7,.1);hero.add(charm);
  // Five collectible star shards
  const shardMat=new THREE.MeshStandardMaterial({color:0xd5c5ff,emissive:0x8158dd,emissiveIntensity:1.8,metalness:.2,roughness:.2});
  const shards=[];
  [[-12,-17],[19,-27],[29,13],[-29,19],[2,37]].forEach(([x,z],i)=>{const g=new THREE.Group();const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.85),shardMat);gem.scale.y=1.55;gem.castShadow=true;g.add(gem);const light=new THREE.PointLight(0xb99aff,2.5,9);light.position.y=.5;g.add(light);g.position.set(x,1.5,z);scene.add(g);shards.push({g,found:false,phase:i});});
  // Ambient floating motes
  const motes=[];for(let i=0;i<45;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.055,6,6),new THREE.MeshBasicMaterial({color:0xffedc9}));m.position.set((Math.random()-.5)*75,Math.random()*9,(Math.random()-.5)*75);scene.add(m);motes.push(m);}
  let yaw=0,found=0,keys={},jumping=false,vy=0,toastTimer=0,clock=new THREE.Clock(),drag=null,burstUntil=0,won=false;
  const toast=document.getElementById('toast'),counter=document.getElementById('counter'),quest=document.getElementById('quest');
  const say=(s)=>{toast.textContent=s;toast.classList.add('show');toastTimer=2.3;};
  function collect(){for(const s of shards){if(!s.found&&hero.position.distanceTo(s.g.position)<2.4){s.found=true;scene.remove(s.g);found++;counter.textContent='✧ '+found+' / 5';say('A star fragment has joined your constellation!');if(found===5){won=true;quest.textContent='Quest complete! The valley remembers your name.';say('✧ All five fragments restored. The stars awaken!');}}}}
  function cast(){burstUntil=clock.elapsedTime+.55;say('Starburst! Celestial light blooms around you.');}
  document.getElementById('spell').addEventListener('click',cast);
  document.getElementById('jump').addEventListener('click',()=>{if(!jumping){vy=8;jumping=true;}});
  document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(k===' '&&!jumping){vy=8;jumping=true;}if(k==='e')cast();});
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});
  renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.008;drag.x=e.clientX;drag.y=e.clientY;});
  renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
  function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
  addEventListener('resize',resize);
  loading.classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('help').classList.remove('hidden');
  function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
   const forward=(keys.up||keys.w||keys.arrowup?1:0)-(keys.down||keys.s||keys.arrowdown?1:0);
   const side=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0);
   if((forward||side)&&!won){const dir=new THREE.Vector3(side,0,-forward).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);hero.position.addScaledVector(dir,7.8*dt);hero.position.x=THREE.MathUtils.clamp(hero.position.x,-52,52);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-52,52);hero.rotation.y=Math.atan2(dir.x,dir.z);torso.position.y=1.35+Math.abs(Math.sin(t*12))*.07;}
   else torso.position.y=1.35;
   if(jumping){hero.position.y+=vy*dt;vy-=19*dt;if(hero.position.y<=0){hero.position.y=0;vy=0;jumping=false;}}
   shards.forEach(s=>{if(!s.found){s.g.rotation.y+=dt*.8;s.g.position.y=1.5+Math.sin(t*2+s.phase)*.2;}});
   motes.forEach((m,i)=>m.position.y+=Math.sin(t+i)*dt*.12);
   if(t<burstUntil){const glow=new THREE.PointLight(0xb89cff,4,13);glow.position.copy(hero.position);glow.position.y+=1.5;scene.add(glow);setTimeout(()=>scene.remove(glow),40);}
   collect();if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toast.classList.remove('show');}
   const target=new THREE.Vector3(hero.position.x,2.1+hero.position.y,hero.position.z);
   const offset=new THREE.Vector3(0,6,11).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
   camera.position.lerp(target.clone().add(offset),1-Math.pow(.0007,dt));camera.lookAt(target);
   renderer.render(scene,camera);
  }frame();
 }
})();
</script>
</body>
</html>
